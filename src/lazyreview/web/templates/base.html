<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lazyreview{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('lazyreview-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/marked@15.0.7/marked.min.js"></script>
  <script src="https://unpkg.com/dompurify@3.2.5/dist/purify.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3">
      <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">
        <img src="/static/img/logo.png" alt="" width="32" height="32"
             class="h-8 w-8 shrink-0 dark:invert" />
        <span>lazyreview</span>
      </a>
      <div class="flex items-center gap-4">
        <nav class="flex items-center gap-4 text-sm text-slate-600 dark:text-slate-300">
          <a class="hover:text-slate-900 dark:hover:text-white" href="/">PRs</a>
          <a class="hover:text-slate-900 dark:hover:text-white" href="/analytics">Analytics</a>
          <a class="hover:text-slate-900 dark:hover:text-white" href="/settings">Settings</a>
        </nav>
        <button type="button" id="theme-toggle" aria-label="Toggle theme"
                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg class="h-4 w-4 dark:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
          <svg class="hidden h-4 w-4 dark:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-7xl px-4 pb-8 text-center text-xs text-slate-400 dark:text-slate-500">
    lazyreview {{ version }}
    <span aria-hidden="true"> · </span>
    <a href="/why" class="hover:text-slate-600 hover:underline dark:hover:text-slate-300">Why lazyreview?</a>
  </footer>
  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.classList.contains('dark') ? 'light' : 'dark';
      root.classList.toggle('dark', next === 'dark');
      try { localStorage.setItem('lazyreview-theme', next); } catch (e) {}
    });
  </script>
</body>
</html>
