{% extends "base.html" %}
{% block title %} — PRs{% endblock %}
{% block content %}
<div class="space-y-6" x-data="homePage()" x-init="tickRelative()">
  <div class="flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Pull requests</h1>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
        Paste a GitHub PR URL, or refresh PRs where you are a requested reviewer.
      </p>
      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
        Last fetch:
        <span class="cursor-help underline decoration-dotted underline-offset-2"
              :title="lastSyncExact || 'Never synced'"
              x-text="lastSyncRelative"></span>
      </p>
    </div>
    <div class="flex flex-col items-stretch gap-2 sm:items-end">
      <button type="button" @click="syncPending()" :disabled="syncing"
              class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50 disabled:opacity-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">
        <span x-text="syncing ? 'Refreshing…' : 'Refresh pending reviews'"></span>
      </button>
      <p class="text-xs text-slate-500 dark:text-slate-400" x-text="syncMsg"></p>
    </div>
  </div>

  <form id="resolve-form" class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900 sm:flex-row sm:items-end">
    <div class="flex-1">
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="pr-url">PR URL</label>
      <input id="pr-url" name="url" type="url" required placeholder="https://github.com/org/repo/pull/123"
             class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
    </div>
    <button type="submit"
            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
      Resolve
    </button>
  </form>
  <script>
    document.getElementById('resolve-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('pr-url').value;
      const res = await fetch('/api/prs/resolve', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || 'Failed to resolve PR');
        return;
      }
      const d = await res.json();
      window.location = '/prs/' + d.id;
    });
  </script>

  <div class="flex flex-wrap items-center gap-4 text-sm text-slate-700 dark:text-slate-300">
    <label class="inline-flex items-center gap-2">
      <input type="checkbox" x-model="hideDrafts" class="rounded border-slate-300" />
      Hide drafts
    </label>
    <span class="text-xs text-slate-500 dark:text-slate-400"
          x-text="visibleCount + ' shown · ' + openPrs.length + ' open'"></span>
  </div>

  <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <table class="min-w-full divide-y divide-slate-200 text-sm dark:divide-slate-700">
      <thead class="bg-slate-50 text-left text-xs font-medium uppercase tracking-wide text-slate-500 dark:bg-slate-800/80 dark:text-slate-400">
        <tr>
          <th class="px-4 py-3">PR</th>
          <th class="px-4 py-3">Title</th>
          <th class="px-4 py-3">Author</th>
          <th class="px-4 py-3">PR status</th>
          <th class="px-4 py-3">Action needed</th>
          <th class="px-4 py-3">Runs</th>
          <th class="px-4 py-3" title="Status of the most recent agentic review run for this PR">Latest run</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        <template x-for="pr in filteredPrs" :key="pr.id">
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">
            <td class="px-4 py-3 font-medium whitespace-nowrap">
              <a class="text-blue-600 hover:underline dark:text-blue-400"
                 :href="'/prs/' + pr.id"
                 x-text="pr.owner + '/' + pr.repo + '#' + pr.number"></a>
            </td>
            <td class="px-4 py-3 text-slate-700 dark:text-slate-300" x-text="pr.title"></td>
            <td class="px-4 py-3 text-slate-600 dark:text-slate-300" x-text="pr.author || '—'"></td>
            <td class="px-4 py-3">
              <span class="rounded-full px-2 py-0.5 text-xs"
                    :class="prStatusClass(pr)"
                    x-text="prStatusLabel(pr)"></span>
            </td>
            <td class="px-4 py-3">
              <span class="rounded-full px-2 py-0.5 text-xs"
                    :class="pr.review_requested ? 'bg-amber-100 text-amber-900 dark:bg-amber-900/40 dark:text-amber-200' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'"
                    x-text="pr.review_requested ? 'needs review' : '—'"></span>
            </td>
            <td class="px-4 py-3" x-text="pr.run_count"></td>
            <td class="px-4 py-3">
              <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs dark:bg-slate-800"
                    x-text="pr.latest_status || '—'"></span>
            </td>
          </tr>
        </template>
        <tr x-show="filteredPrs.length === 0">
          <td colspan="7" class="px-4 py-8 text-center text-slate-500 dark:text-slate-400">
            No PRs match the current filters.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function formatRelative(iso) {
  if (!iso) return 'never';
  const then = new Date(iso);
  if (Number.isNaN(then.getTime())) return 'unknown';
  const seconds = Math.round((Date.now() - then.getTime()) / 1000);
  if (seconds < 45) return 'just now';
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return minutes === 1 ? '1 minute ago' : minutes + ' minutes ago';
  const hours = Math.round(minutes / 60);
  if (hours < 48) return hours === 1 ? '1 hour ago' : hours + ' hours ago';
  const days = Math.round(hours / 24);
  return days === 1 ? '1 day ago' : days + ' days ago';
}

function formatExact(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString();
}

function homePage() {
  return {
    prs: {{ prs|tojson }},
    hideDrafts: true,
    syncing: false,
    syncMsg: '',
    lastSyncIso: {{ (last_sync or '')|tojson }},
    lastSyncRelative: 'never',
    lastSyncExact: '',
    get openPrs() {
      // Sync only fetches open PRs; drop closed/merged leftovers from the home list.
      return this.prs.filter((pr) => {
        const state = (pr.state || 'open').toLowerCase();
        return state !== 'closed' && state !== 'merged';
      });
    },
    get filteredPrs() {
      return this.openPrs.filter((pr) => {
        if (this.hideDrafts && !!pr.is_draft) return false;
        return true;
      });
    },
    get visibleCount() {
      return this.filteredPrs.length;
    },
    prStatusLabel(pr) {
      if (pr.is_draft) return 'draft';
      return (pr.state || 'open').toLowerCase();
    },
    prStatusClass(pr) {
      const label = this.prStatusLabel(pr);
      if (label === 'draft') return 'bg-slate-200 text-slate-800 dark:bg-slate-700 dark:text-slate-200';
      if (label === 'open') return 'bg-emerald-100 text-emerald-900 dark:bg-emerald-900/40 dark:text-emerald-200';
      if (label === 'merged') return 'bg-purple-100 text-purple-900 dark:bg-purple-900/40 dark:text-purple-200';
      if (label === 'closed') return 'bg-red-100 text-red-900 dark:bg-red-900/40 dark:text-red-200';
      return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
    },
    tickRelative() {
      this.lastSyncRelative = formatRelative(this.lastSyncIso);
      this.lastSyncExact = formatExact(this.lastSyncIso);
      setInterval(() => {
        this.lastSyncRelative = formatRelative(this.lastSyncIso);
      }, 30000);
    },
    async syncPending() {
      this.syncing = true;
      this.syncMsg = '';
      try {
        const res = await fetch('/api/prs/sync-pending', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'sync failed');
        this.syncMsg = `Fetched ${data.fetched}, updated ${data.upserted}` +
          (data.cleared_stale ? `, cleared ${data.cleared_stale} stale` : '') + '.';
        window.location.reload();
      } catch (e) {
        this.syncMsg = String(e.message || e);
        this.syncing = false;
      }
    }
  }
}
</script>
{% endblock %}
