# lazyreview configuration
# Location (default): ~/.config/lazyreview/config.toml (Docker: /data/config.toml)
# Override path with LAZYREVIEW_CONFIG=/path/to/config.toml
# Restart the daemon after changes (Docker: `docker compose restart`).
# Under Docker, host/port/data_dir are fixed by the image; publish a different
# host port with LAZYREVIEW_HOST_PORT in .env instead.

[server]
host = "127.0.0.1"
port = 3334
# Extra Host names the UI may be reached by (localhost and 127.0.0.1 always work),
# e.g. ["myhost.lan", "192.168.1.20"]. Also settable as LAZYREVIEW_ALLOWED_HOSTS.
allowed_hosts = []

[paths]
# Empty = ~/.local/share/lazyreview (XDG data home)
data_dir = ""
# Empty = {data_dir}/runs
runs_dir = ""

[worker]
job_timeout_seconds = 3600
retention_sweep_seconds = 3600
# How many agent reviews may run at once across all PRs (each is a full CLI process).
max_concurrent_jobs = 10
# How many PR analyses may run at once (rest stay queued).
max_concurrent_analyses = 2
