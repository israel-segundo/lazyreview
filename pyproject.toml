[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyreview"
version = "0.1.0"
description = "Agentic code review management tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "lazyreview" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.3.0"]

[project.scripts]
lazyreview = "lazyreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyreview"]

[tool.ruff]
line-length = 100
target-version = "py312"
